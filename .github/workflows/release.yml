name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Version sync (tag vs package.json / jsr.json)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in packages/dali-orm/package.json packages/dali-orm/jsr.json; do
            CFG=$(node -p "require('./$f').version")
            if [ "$TAG" != "$CFG" ]; then
              echo "tag v$TAG does not match $f version $CFG"; exit 1
            fi
          done
      - run: pnpm build && pnpm test:coverage && pnpm lint

  publish-npm:
    name: Publish to npm
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - name: "Pack (materialize catalog: dependencies)"
        working-directory: packages/dali-orm
        run: |
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/tmp-pkg"
          mkdir -p "$GITHUB_WORKSPACE/publish/pkg"
          tar xzf "$GITHUB_WORKSPACE"/tmp-pkg/woss-dali-orm-*.tgz --strip-components=1 -C "$GITHUB_WORKSPACE/publish/pkg"
      - name: Publish with provenance
        working-directory: ${{ github.workspace }}/publish/pkg
        run: npm publish --provenance --access public

  publish-jsr:
    name: Publish to JSR
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - name: Publish to JSR
        working-directory: packages/dali-orm
        run: npx jsr@latest publish

  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package tarball
        run: tar czf "dali-orm-${GITHUB_REF_NAME}.tar.gz" -C packages/dali-orm dist package.json README.md CHANGELOG.md
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dali-orm-*.tar.gz
