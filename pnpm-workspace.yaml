packages:
  - 'packages/*'
  - 'examples/*'

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  svelte-preprocess: true

catalog:
  '@surrealdb/node': '3.0.3'
  '@types/node': '25.5.0'
  '@vitest/coverage-v8': '4.1.5'
  obug: '2.1.1'
  surrealdb: '2.0.3'
  tsup: '8.5.1'
  tsx: '4.20.0'
  typescript: 5.9.3
  valibot: '1.3.1'
  vitest: '4.1.5'
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
